name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What the generated docblocks miss or get wrong, with the model definition that shows it.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: The solution you would like
